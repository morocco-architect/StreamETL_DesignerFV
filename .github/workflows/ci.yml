name: StreamETL CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      DATABASE_URL: sqlite:///:memory:
      STREAMETL_AI_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        working-directory: backend
        run: |
          mkdir -p ../artifacts
          pytest -v \
            --junitxml=../artifacts/pytest-py${{ matrix.python-version }}.xml \
            --cov=. \
            --cov-report=xml:../artifacts/coverage-py${{ matrix.python-version }}.xml \
            --cov-report=term-missing
      - name: Upload backend evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence-py${{ matrix.python-version }}
          path: artifacts/*py${{ matrix.python-version }}.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
