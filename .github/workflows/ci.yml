
name: StreamETL CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    env:
      DATABASE_URL: "sqlite:///:memory:"
      STREAMETL_AI_PROVIDER: "disabled"
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run tests with branch coverage
        run: |
          mkdir -p artifacts
          python -m pytest backend/tests backend/intelligence/tests -q \
            --cov=backend \
            --cov-branch \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage-py${{ matrix.python-version }}.xml \
            --junitxml=artifacts/pytest-py${{ matrix.python-version }}.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-evidence-py${{ matrix.python-version }}
          path: |
            artifacts/coverage-py${{ matrix.python-version }}.xml
            artifacts/pytest-py${{ matrix.python-version }}.xml
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
